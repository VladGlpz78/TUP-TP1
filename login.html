<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inicio de sesión del Portal de gestión académica de la Escuela Normal."
    />
    <title>Iniciar sesión - Escuela Normal</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body class="bg-light">
    <div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
      
      <div class="card border-0 shadow-sm rounded-3 p-4 p-md-5 bg-white" style="max-width: 400px; width: 100%;">
        
        <div class="text-center mb-4">
          <div class="fs-1 mb-2">🏛️</div>
          <h1 class="h4 fw-bold mb-1 text-primary">Escuela Normal</h1>
          <p class="text-secondary small mb-0">Portal académico para alumnos y padres</p>
        </div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label fw-semibold text-secondary">Usuario</label>
            <input
              type="text"
              class="form-control"
              id="usuario"
              placeholder="Ingresá tu usuario"
              autocomplete="username"
            />
          </div>

          <div class="mb-3">
            <label for="contrasena" class="form-label fw-semibold text-secondary">Contraseña</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="contrasena"
                placeholder="Ingresá tu contraseña"
                autocomplete="current-password"
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="toggle-password"
                aria-label="Mostrar u ocultar contraseña"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="recordarme" />
            <label class="form-check-label small text-secondary" for="recordarme">
              Recordarme en este dispositivo
            </label>
          </div>

          <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert"></div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            Iniciar sesión
          </button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
          ¿Problemas para ingresar? Comunicate con
          <a href="mailto:contacto@escuelanormal.edu.ar" class="text-primary text-decoration-none fw-bold">Administración</a>.
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
  </body>
</html>
